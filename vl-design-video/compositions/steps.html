  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const STEP = 2.4;
      const cards = ["#s-c1", "#s-c2", "#s-c3", "#s-c4"];
      const bodies = ["#s-b1", "#s-b2", "#s-b3", "#s-b4"];
      gsap.set(cards, { y: 1000, opacity: 0 });
      gsap.set("#s-verb-stack", { y: 0, filter: "blur(0px)" });
      tl.fromTo("#s-label", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0.05);
      tl.fromTo("#s-verb-win", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0.1);

      cards.forEach((c, i) => {
        const T = i * STEP + (i === 0 ? 0.1 : 0);
        // card whips in from below
        tl.fromTo(c, { y: 1000, opacity: 1, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out", immediateRender: false }, T);
        // body copy blur-swap
        tl.fromTo(bodies[i], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15 }, T + 0.15);
        if (i > 0) {
          // verb rolls like a slot machine
          tl.to("#s-verb-stack", { y: -150 * i, duration: 0.35, ease: "power3.inOut" }, T - 0.05);
          tl.to("#s-verb-stack", { filter: "blur(5px)", duration: 0.12, yoyo: true, repeat: 1 }, T - 0.02);
        }
        if (i < cards.length - 1) {
          const tOut = T + STEP - 0.3 - (i === 0 ? 0.1 : 0);
          tl.to(c, { y: -1000, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, tOut);
          tl.set(c, { opacity: 0 }, tOut + 0.3);
          tl.to(bodies[i], { opacity: 0, filter: "blur(6px)", duration: 0.13 }, T + STEP - 0.2 - (i === 0 ? 0.1 : 0));
        }
      });
      // checklist ticks in on the last step
      tl.fromTo(".s-row", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.25, ease: "expo.out" }, 3 * STEP + 0.45);
      // dip cut into the makeover
      tl.to("#s-dip", { opacity: 0.4, duration: 0.1 }, 9.38);
      window.__timelines["steps"] = tl;
    })();
