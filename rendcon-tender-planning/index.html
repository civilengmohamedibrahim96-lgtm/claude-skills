<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendcon Tender Planning</title>
<meta name="description" content="Tender planning board for Rendcon: assign projects to engineers, track tags, sub-tasks, links, files and reminders, with hourly email intake.">
<meta name="theme-color" content="#161616">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9E9E6; --surface:#FFFFFF; --surface-2:#F5F5F3; --surface-3:#EFEFEC;
  --line:#D8D8D3; --line-2:#C7C7C1;
  --ink:#111111; --ink-2:#3A3A38; --muted:#74746F;
  --accent:#EE6A1F; --accent-2:#D4560F; --accent-soft:#FCE5D6; --accent-line:#F6B38A;
  --dark:#161616; --dark-2:#232323; --dark-line:#333331;
  --danger:#C8321E; --ok:#2E7D4F;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --shadow-1:0 1px 0 rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --shadow-2:0 6px 18px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
  --shadow-3:0 22px 48px rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[dir=rtl],.ar{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",sans-serif}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:where([hidden]){display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App bar ---------- */
.appbar{flex:none;height:58px;background:var(--dark);color:#F2F2EF;display:flex;align-items:center;gap:14px;padding:0 20px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand small{display:block;font-weight:500;color:#9A9A95;font-size:11.5px;letter-spacing:.02em}
.appbar .grow{flex:1}
.chip-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--dark-line);background:var(--dark-2);color:#E8E8E4;font-size:13px;font-weight:500;transition:background .2s,border-color .2s,transform .15s}
.chip-btn:hover{background:#2C2C2B;border-color:#444}
.chip-btn:active{transform:scale(.97)}
.chip-btn .dot{width:8px;height:8px;border-radius:50%;background:#6B6B67}
.chip-btn.on .dot{background:#3BC170;box-shadow:0 0 0 3px rgba(59,193,112,.18)}
.chip-btn .count{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.sync-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-meta{font-size:11.5px;color:#9A9A95;font-family:var(--mono)}

/* ---------- Toolbar ---------- */
.toolbar{flex:none;display:flex;align-items:center;gap:8px;padding:16px 20px 8px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;height:36px;padding:0 14px;min-width:240px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;outline:0;background:none;width:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:4px}
.fchip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .18s var(--ease)}
.fchip:hover{border-color:var(--line-2);transform:translateY(-1px)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tdot{width:8px;height:8px;border-radius:50%;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px;transition:background .18s,border-color .18s,transform .12s,box-shadow .18s}
a.btn{text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:32px;padding:0;justify-content:center}
.toolbar .spacer{flex:1}

/* ---------- Board ---------- */
.board{display:flex;gap:20px;padding:12px 24px 28px;overflow-x:auto;flex:1;min-height:0;align-items:flex-start;scroll-behavior:smooth}
.board::-webkit-scrollbar{height:10px}
.board::-webkit-scrollbar-thumb{background:#C9C9C4;border-radius:9px;border:2px solid var(--bg)}
.col{flex:0 0 336px;max-height:100%;display:flex;flex-direction:column;background:var(--surface-3);border:1px solid var(--line);border-radius:16px;animation:colIn .45s var(--ease) both}
@keyframes colIn{from{opacity:0;transform:translateY(10px)}}
.col.unassigned{background:repeating-linear-gradient(135deg,#ECECE8 0 10px,#E6E6E2 10px 20px);border-style:dashed;border-color:var(--line-2)}
.col-head{display:flex;align-items:center;gap:12px;padding:16px 12px 14px 16px;border-radius:16px 16px 0 0}
.col-who{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:4px;margin:-4px;border-radius:10px;text-align:left;transition:background .18s}
button.col-who:hover{background:rgba(255,255,255,.7)}
button.col-who:hover .edit-hint{opacity:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none;letter-spacing:.02em}
.avatar.sm{width:24px;height:24px;font-size:10px}
.avatar.lg{width:56px;height:56px;font-size:19px}
.avatar.ghost{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted)}
.col.unassigned .col-head .avatar{background:var(--accent)}
.col-title{font-weight:600;font-size:14.5px;line-height:1.25;flex:1;min-width:0}
.col-title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-title small{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.edit-hint{opacity:0;color:var(--muted);transition:opacity .18s}
.edit-hint svg.i{width:14px;height:14px}
.col-count{font:500 12px var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.col-list{padding:2px 12px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:72px;flex:1;transition:background .2s}
.col-list.over{background:rgba(238,106,31,.06)}
.col-foot{padding:0 12px 12px}
.add-card{width:100%;height:40px;justify-content:flex-start;color:var(--muted);background:transparent;border:1px dashed transparent;border-radius:10px}
.add-card:hover{color:var(--ink);background:var(--surface);border-color:var(--line)}
.board::after{content:"";flex:0 0 4px}
.add-col{flex:0 0 280px;height:64px;border:1.5px dashed var(--line-2);border-radius:16px;background:transparent;color:var(--ink-2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s var(--ease)}
.add-col:hover{border-color:var(--accent);color:var(--accent);background:rgba(238,106,31,.05)}
.empty-col{color:var(--muted);font-size:13px;text-align:center;padding:28px 12px;border:1.5px dashed var(--line-2);border-radius:12px}
.pill.inv{background:#FFF3E8;color:var(--accent-2)}

/* ---------- Card ---------- */
.card{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow-1);cursor:grab;user-select:none;touch-action:none;position:relative;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s;animation:cardIn .4s var(--ease) both}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--line-2)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform .3s var(--ease)}
.card:hover::before,.card:focus-visible::before{transform:none}
.card.is-late::before{background:var(--danger)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
.card.dropped{animation:pop .42s var(--ease)}
@keyframes pop{0%{transform:scale(.96)}55%{transform:scale(1.025)}100%{transform:scale(1)}}
.card.fresh{animation:fresh 2.4s var(--ease)}
@keyframes fresh{0%,40%{box-shadow:0 0 0 3px var(--accent-line),var(--shadow-2)}100%{box-shadow:var(--shadow-1)}}
.card.ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:var(--shadow-3);transform:scale(1.03);cursor:grabbing;transition:none;animation:none;border-color:var(--accent-line)}
.placeholder{border:2px dashed var(--accent-line);background:rgba(238,106,31,.07);border-radius:14px;flex:none;animation:ph .2s var(--ease)}
@keyframes ph{from{opacity:0}}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.c-ref{font:500 11.5px var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap}
.duepill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;flex:none}
.duepill svg.i{width:13px;height:13px}
.duepill.soon{background:var(--accent-soft);color:var(--accent-2)}
.duepill.late{background:#FBE3DF;color:var(--danger)}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.42;letter-spacing:-.008em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-client{margin-top:4px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-status{margin-top:14px;padding:9px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.c-foot{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:12px;border-top:1px solid var(--surface-3);color:var(--muted);font-size:12px}
.c-foot span{display:inline-flex;align-items:center;gap:4px}
.c-foot .avatar{display:grid;gap:0}
.c-foot .na{font-size:12px;color:var(--muted);font-style:italic}
.c-foot svg.i{width:14px;height:14px}
.c-foot .bell{color:var(--accent)}
.c-tasks{gap:8px!important;font:500 11.5px var(--mono);color:var(--ink-2)}
.c-bar{width:44px;height:5px;border-radius:5px;background:var(--surface-3);overflow:hidden;display:block}
.c-bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .5s var(--ease)}
.c-foot .grow{flex:1}
.prog{height:4px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s var(--ease)}
.src{font:600 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--accent-2);background:var(--accent-soft);padding:1px 6px;border-radius:4px}

/* ---------- Team, profile, reminders ---------- */
.me-btn{border:0;background:none;padding:0;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.me-btn:hover{transform:scale(1.05)}
.me-btn .avatar{box-shadow:0 0 0 2px var(--dark),0 0 0 3.5px var(--accent)}
.member{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--surface-3);animation:cardIn .3s var(--ease) both}
.member .b{flex:1;min-width:0}
.member .b b{display:flex;align-items:center;gap:8px;font-weight:600}
.member .b small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .acts{display:flex;gap:4px}
.invite-box{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2)}
.invite-box .formgrid{margin-bottom:12px}
.lbl-sm{font-size:12px;color:var(--muted);font-weight:500;display:block;margin-bottom:6px}
.prof-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.prof-head h3{margin:0}
.prof-head small{color:var(--muted)}
.swatches{display:flex;gap:8px}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;transition:transform .15s}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.swatches button:hover{transform:scale(1.1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stats div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:20px;font-weight:600}
.stats small{color:var(--muted);font-size:12px}
.chk-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.chk-row input{accent-color:var(--accent);width:16px;height:16px}
.recips{display:flex;flex-wrap:wrap;gap:6px}
.recips button{height:30px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .18s var(--ease)}
.recips button.txt{padding:0 12px}
.recips button:hover{border-color:var(--line-2)}
.recips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.recips .avatar.sm{width:22px;height:22px;font-size:9.5px}
.sent{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--surface-3);font-size:13px}
.sent .b{flex:1;min-width:0}
.sent small{color:var(--muted);display:block}
.modal .box.wide{width:min(560px,calc(100vw - 32px))}
.sheet.wide{width:min(600px,100vw)}
.view-banner{background:var(--accent);color:#fff;font-size:12.5px;font-weight:500;text-align:center;padding:6px 12px;flex:none}
.view-banner button{background:rgba(0,0,0,.18);border:0;color:#fff;border-radius:6px;padding:2px 8px;margin-left:8px;font-size:12px}

/* ---------- Project page ---------- */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.38);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.page{position:fixed;top:0;right:0;bottom:0;width:min(1120px,100vw);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .42s var(--ease),box-shadow .42s;display:flex;flex-direction:column}
.page.show{transform:none;box-shadow:var(--shadow-3)}
.page-head{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;gap:12px;align-items:center}
.page-head .t{flex:1;min-width:0}
.crumb{font:500 12px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:2px;flex-wrap:wrap}
.title-in{width:100%;border:1px solid transparent;border-radius:8px;padding:4px 8px;margin-left:-8px;font-size:22px;font-weight:600;letter-spacing:-.015em;background:transparent;text-align:left;transition:border-color .2s,background .2s}
.title-in:hover{border-color:var(--line)}
.title-in:focus{border-color:var(--accent);background:#fff;outline:0}
.page-body{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:16px;padding:16px 24px 40px;align-content:start}
.page-body>div{min-width:0;display:flex;flex-direction:column;gap:16px}
.page-body>div:last-child{position:sticky;top:0;align-self:start}
.addrow .in,.formgrid .in{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 18px;animation:cardIn .45s var(--ease) both}
.panel h4{margin:0 0 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.panel h4 .grow{flex:1}
.field{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--surface-3)}
.field:last-child{border-bottom:0}
.field label{color:var(--muted);font-size:12.5px;font-weight:500}
.in{width:100%;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 10px;background:var(--surface);transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:0}
textarea.in{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .18s var(--ease)}
.tagpick button:hover{transform:translateY(-1px);border-color:var(--line-2)}
.tagpick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tagpick .newtag{width:120px;height:28px;border-radius:999px;border:1px dashed var(--line-2);padding:0 10px;font-size:12px;background:transparent}
.folder{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.folder .gd{width:26px;height:26px;flex:none}
.folder a{color:var(--ink);font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 1.5px no-repeat;transition:background-size .3s var(--ease)}
.folder a:hover{background-size:100% 1.5px}

/* sub-tasks */
.sub-head{cursor:pointer;user-select:none}
.sub-head .chev{transition:transform .3s var(--ease)}
.sub-head.closed .chev{transform:rotate(-90deg)}
.collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--ease)}
.collapse.closed{grid-template-rows:0fr}
.collapse > div{overflow:hidden}
.sub{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--surface);transition:border-color .2s,box-shadow .2s;animation:cardIn .3s var(--ease) both}
.sub:hover{border-color:var(--line-2)}
.sub-row{display:flex;align-items:center;gap:9px;padding:7px 8px 7px 10px}
.chk{width:18px;height:18px;border-radius:5px;border:1.6px solid var(--line-2);display:grid;place-items:center;flex:none;background:#fff;transition:all .2s var(--ease);padding:0}
.chk svg{width:12px;height:12px;stroke:#fff;stroke-width:3;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}
.sub.done .chk{background:var(--accent);border-color:var(--accent)}
.sub.done .chk svg{opacity:1;transform:none}
.sub-text{flex:1;border:0;background:transparent;padding:3px 4px;border-radius:5px;min-width:0}
.sub-text:focus{background:var(--surface-2);outline:0}
.sub.done .sub-text{text-decoration:line-through;color:var(--muted)}
.sub-due{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.sub-x{opacity:0;transition:opacity .15s}
.sub:hover .sub-x{opacity:1}
.sub-tog svg{transition:transform .3s var(--ease)}
.sub.open .sub-tog svg{transform:rotate(180deg)}
.sub-more{padding:0 10px 10px 38px;display:grid;gap:8px;grid-template-columns:1fr 150px}
.sub-more textarea{min-height:56px;grid-column:1/2}
.addrow{display:flex;gap:8px;margin-top:8px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);position:relative;margin:-16px -18px 16px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 7px;flex:none;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab .n{font:500 10.5px var(--mono);background:var(--surface-3);border-radius:999px;padding:0 6px}
.tab.on .n{background:var(--accent-soft);color:var(--accent-2)}
.tab-ink{position:absolute;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;transition:left .35s var(--ease),width .35s var(--ease)}
.tabpane{animation:paneIn .35s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}
.list-item{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--surface-3);transition:background .15s}
.list-item:hover{background:var(--surface-2)}
.list-item:last-child{border-bottom:0}
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--ink-2);font:700 9.5px var(--mono)}
.ico.pdf{background:#FBE3DF;color:#B42318}
.ico.dwg{background:#E4E9F2;color:#2D4A7A}
.ico.xls{background:#DFF1E5;color:#1D6B3B}
.ico.doc{background:#E1E9FB;color:#1E4FB8}
.ico.img{background:#F3E9D7;color:#7A5410}
.list-item .body{flex:1;min-width:0}
.list-item .body b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .body a{color:var(--ink);text-decoration:none}
.list-item .body a:hover{color:var(--accent-2)}
.list-item .body small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13px}
.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface-3);animation:cardIn .3s var(--ease) both}
.comment .avatar{width:30px;height:30px}
.comment .b{flex:1;min-width:0}
.comment .who{font-weight:600;font-size:13px}
.comment .who time{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.comment p{margin:3px 0 0;white-space:pre-wrap;word-wrap:break-word}
.comment.sys .avatar{background:var(--accent-soft);color:var(--accent-2)}
.comment.sys p{color:var(--ink-2);font-size:13px}
.drop{display:block;cursor:pointer;border:1.5px dashed var(--line-2);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);transition:all .2s var(--ease);background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2);transform:scale(1.01)}
.drop b{color:var(--ink)}
.up{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--surface-3)}
.up .bar{height:4px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin-top:5px}
.up .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.up.done .bar i{background:var(--ok)}
.rem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--surface-3)}
.rem.fired{opacity:.55}
.rem .when{font:500 12px var(--mono);color:var(--ink-2)}
.pill{font:600 10.5px var(--mono);padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.pill.o{background:var(--accent-soft);color:var(--accent-2)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.formgrid .full{grid-column:1/-1}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- Side sheets (email, reminders) ---------- */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);z-index:60;transform:translateX(100%);transition:transform .4s var(--ease),box-shadow .4s;display:flex;flex-direction:column}
.sheet.show{transform:none;box-shadow:var(--shadow-3)}
.sheet-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-size:17px;flex:1}
.sheet-body{flex:1;overflow:auto;padding:16px 20px 30px}
.mail{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;animation:cardIn .35s var(--ease) both;background:var(--surface)}
.mail .subj{font-weight:600;font-size:14px}
.mail .from{color:var(--muted);font-size:12px;margin-top:2px}
.mail .snip{color:var(--ink-2);font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mail .res{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:12px;color:var(--ink-2)}
.mail.pending{background:var(--surface-2);border-style:dashed}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center;margin-bottom:16px}
.kv label{color:var(--muted);font-size:12.5px}
.switch{width:38px;height:22px;border-radius:999px;background:var(--line-2);border:0;position:relative;transition:background .25s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.section-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 10px}
.scan{height:3px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin:4px 0 14px;opacity:0;transition:opacity .2s}
.scan.on{opacity:1}
.scan i{display:block;height:100%;width:35%;background:var(--accent);border-radius:3px;animation:scan 1.1s var(--ease) infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:70;pointer-events:none}
.modal .box{width:min(460px,calc(100vw - 32px));background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:20px;opacity:0;transform:translateY(12px) scale(.98);transition:all .3s var(--ease)}
.modal.show{pointer-events:auto}
.modal.show .box{opacity:1;transform:none}
.modal h3{margin:0 0 14px;font-size:17px}
.modal .row{display:grid;gap:6px;margin-bottom:12px}
.modal .row label{font-size:12.5px;color:var(--muted);font-weight:500}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--dark);color:#F2F2EF;padding:10px 14px 10px 12px;border-radius:10px;box-shadow:var(--shadow-3);display:flex;align-items:center;gap:10px;font-size:13px;animation:toastIn .4s var(--ease) both;pointer-events:auto;max-width:min(520px,calc(100vw - 32px))}
.toast .ti{width:24px;height:24px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.toast .ti svg{stroke:#fff;width:14px;height:14px}
.toast b{font-weight:600}
.toast.out{animation:toastOut .3s var(--ease) both}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}

/* ---------- Menu ---------- */
.menu{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-2);padding:5px;min-width:180px;animation:menuIn .18s var(--ease)}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;text-align:left;font-size:13px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}

@media (max-width:1180px){.tab>svg.i{display:none}}
@media (max-width:960px){.page-body{grid-template-columns:1fr}.page-body>div:last-child{position:static}.tab>svg.i{display:inline}}

  .page-head{padding:12px}

  .panel{padding:14px 14px 16px}
  .tabs{margin:-14px -14px 14px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .appbar{padding:0 12px;gap:8px}
  .brand small,.sync-meta,.chip-btn .lbl{display:none}
  .toolbar{padding:12px 12px 4px}
  .search{min-width:0;flex:1}
  .col{flex-basis:86vw}
  .board{gap:14px;padding:10px 12px 20px}

  .addrow{flex-wrap:wrap}
  #subIn{flex:1 1 100%}
  #subDue{flex:1;width:auto!important}
  .formgrid{grid-template-columns:1fr}
  .sub-more{grid-template-columns:1fr;padding-left:10px}

  .appbar{gap:6px}
  .chip-btn{padding:0 9px;gap:6px}

  .view-banner button{display:block;margin:4px auto 0}
  .filters{flex-wrap:nowrap;overflow-x:auto;width:100%;order:3;padding-bottom:2px}
  .fchip{flex:none}
  #resetBtn{display:none}
}

  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';

const localDT=ms=>{const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};

  {id:'un',name:'Unassigned',color:'#111111'},
  {id:'urgent',name:'Urgent',color:'#C8321E'},
  {id:'sub',name:'Submitted',color:'#2E7D4F'},
];

const COLORS=['#111111','#EE6A1F','#5B5B57','#9C4A12','#2F7D7A','#B8860B'];

  const c1=uid(),c2=uid(),c3=uid(),u0=uid(),u1=uid(),u2=uid(),u3=uid();

  return {
    me:u0, adminId:u0,
    users:[
      {id:u0,name:'Mohamed Ibrahim',email:'mohamed@rendcon.example',role:'admin',discipline:'Tender manager',color:'#EE6A1F',status:'active',prefs:{browser:true,email:true,digest:true}},
      {id:u1,name:'Eng. Ahmed Hassan',email:'ahmed@rendcon.example',role:'engineer',discipline:'Civil & structure',color:'#111111',status:'active',prefs:{browser:true,email:true,digest:false}},
      {id:u2,name:'Eng. Sara Mostafa',email:'sara@rendcon.example',role:'engineer',discipline:'MEP',color:'#2F7D7A',status:'active',prefs:{browser:true,email:true,digest:true}},
      {id:u3,name:'Eng. Omar Khaled',email:'omar@rendcon.example',role:'engineer',discipline:'Infrastructure',color:'#9C4A12',status:'invited',invitedAt:Date.now()-2*24*HOUR,prefs:{browser:true,email:true,digest:false}},
    ],

    reminders:[{id:uid(),at:Date.now()+26*HOUR,msg:'Weekly tender review meeting',repeat:'weekly',fired:false,to:['all'],email:true}],
    outbox:[],sentLog:[],
    tags:TAGS.slice(),
    drive:{provider:'google',connected:true,account:'tenders@rendcon.example',root:'https://drive.google.com/drive/folders/1TendersRoot'},
    mail:{connected:true,address:'tenders@rendcon.example',subject:'ورد الينا',hourly:true,lastSync:Date.now()-38*60000,processed:[],log:[]},
    projects:[
      P({title:'توريد وتركيب أعمال الكهرباء – مبنى الإدارة',client:'Ministry of Housing',type:'public',leader:u2,team:[u2,u1],tags:['upd'],columnId:c2,pos:0,status:'Pricing MEP BOQ – waiting on lighting supplier quote',due:isoIn(5),folder:'https://drive.google.com/drive/folders/1aEl104',
        dueHistory:[{from:isoIn(-2),to:isoIn(5),by:'email',at:Date.now()-26*HOUR}],updatedAt:Date.now()-40*60000,updatedBy:'email',
        subtasks:[{id:uid(),text:'Review specs & drawings',done:true,note:'',due:''},{id:uid(),text:'Request supplier quotes',done:true,note:'3 suppliers contacted',due:''},{id:uid(),text:'Price lighting package',done:false,note:'',due:isoIn(2)},{id:uid(),text:'Final BOQ sign-off',done:false,note:'',due:isoIn(4)}],
        links:[{id:uid(),title:'Tender portal',url:'https://tenders.example/electrical-admin'}],
        files:[{id:uid(),name:'Specs_Electrical.pdf',size:'4.2 MB'},{id:uid(),name:'SLD_Rev02.dwg',size:'1.1 MB'},{id:uid(),name:'BOQ_Electrical.xlsx',size:'380 KB'}],
        comments:[{id:uid(),who:'Eng. Sara Mostafa',text:'Lighting quote expected Thursday.',at:Date.now()-26*HOUR}],
        notifications:[{id:uid(),at:Date.now()+20*HOUR,msg:'Chase lighting supplier quote',repeat:'none',fired:false,to:['assignee','me'],email:true}]}),
      P({title:'إنشاء خزان مياه أرضي سعة 5000 م³',client:'Water Authority',type:'public',leader:u1,team:[u1],tags:['new'],columnId:c1,pos:0,status:'Site visit done – structural take-off in progress',due:isoIn(9),folder:'https://drive.google.com/drive/folders/1aEl097',
        updatedAt:Date.now()-3*HOUR,updatedBy:'Eng. Ahmed Hassan',
        subtasks:[{id:uid(),text:'Site visit',done:true,note:'',due:''},{id:uid(),text:'Structural take-off',done:false,note:'',due:isoIn(3)},{id:uid(),text:'Send queries to client',done:true,note:'Sent 12 queries',due:''}],
        files:[{id:uid(),name:'Tank_GA.pdf',size:'2.7 MB'}]}),
      P({title:'Rehabilitation of Internal Roads – Phase 2',client:'New Cities Authority',type:'public',leader:u3,team:[u3],tags:['pp'],columnId:c3,pos:0,status:'Postponed by client – new date to be announced',due:isoIn(30),
        dueHistory:[{from:isoIn(4),to:isoIn(30),by:'email',at:Date.now()-50*HOUR}],updatedAt:Date.now()-50*HOUR,updatedBy:'email',
        links:[{id:uid(),title:'Postponement notice',url:'https://tenders.example/roads-phase-2/notice'}]}),
      P({title:'Fire fighting system – Logistics Hub',client:'Port Logistics Co.',type:'private',leader:u2,team:[u2,u0],tags:['new','urgent'],columnId:c2,pos:1,status:'Hydraulic calc pending',due:isoIn(2),
        updatedAt:Date.now()-20*60000,updatedBy:'Eng. Sara Mostafa',
        subtasks:[{id:uid(),text:'Hydraulic calculation',done:false,note:'',due:isoIn(1)},{id:uid(),text:'Pump room pricing',done:false,note:'',due:isoIn(2)}]}),
      P({title:'صيانة شبكات الصرف الصحي – الحي الثالث',client:'Municipality',type:'public',tags:['new','un'],status:'Received by email – needs an engineer',source:'email',due:isoIn(12),updatedAt:Date.now()-5*HOUR,updatedBy:'email'}),
      P({title:'Steel shed – Industrial Zone plot 14',client:'Private client',type:'private',tags:['un'],status:'',due:isoIn(18),updatedAt:Date.now()-26*HOUR,updatedBy:'Mohamed Ibrahim'}),
      P({title:'Boundary wall & gatehouse',client:'Education Directorate',type:'public',leader:u1,team:[u1],tags:['sub'],columnId:c1,pos:1,status:'Submitted – awaiting opening',due:isoIn(-1),updatedAt:Date.now()-30*HOUR,updatedBy:'Eng. Ahmed Hassan'}),
    ]
  };
}

let S;
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed()}catch(e){S=seed()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

const tagById=id=>S.tags.find(t=>t.id===id);
const colById=id=>S.columns.find(c=>c.id===id);
const userById=id=>S.users.find(u=>u.id===id);
const me=()=>userById(S.me)||S.users[0];
const isAdmin=()=>me().role==='admin';
const colUser=c=>c&&userById(c.userId);
const colName=id=>{const u=colUser(colById(id));return u?u.name:'Engineer'};
const colOfUser=uid_=>S.columns.find(c=>c.userId===uid_);
const avatar=(u,cls='')=>u?`<span class="avatar ${cls}" style="background:${u.color}" title="${esc(u.name)}">${esc(initials(u.name))}</span>`:`<span class="avatar ghost ${cls}" title="Unassigned">${icon('user')}</span>`;
const proj=id=>S.projects.find(p=>p.id===id);
let filterTags=new Set(), query='';

/* ---------------- Toasts ---------------- */
function toast(html,ico='check',ms=3200){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="ti">${icon(ico)}</span><span>${html}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},ms);
}

/* ---------------- Board ---------------- */
function matches(p){
  if(filterTags.size&&![...filterTags].every(t=>t.startsWith('type:')?p.type===t.slice(5):p.tags.includes(t)))return false;
  if(query){const h=(p.title+' '+p.client+' '+p.status+' '+teamOf(p).map(u=>u.name).join(' ')).toLowerCase();if(!h.includes(query))return false}
  return true;
}
function ago(ms){
  if(!ms)return'';const m=Math.round((Date.now()-ms)/60000);
  if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';
  const d=Math.round(h/24);return d<7?d+'d ago':fmtShort(new Date(ms));
}
function touch(p,by){p.updatedAt=Date.now();p.updatedBy=by||me().name}
function setDue(p,val,by){
  if(!val||val===p.due)return false;
  (p.dueHistory=p.dueHistory||[]).unshift({from:p.due,to:val,by,at:Date.now()});
  log(p,`Submission date ${p.due?'changed from '+fmtDate(p.due)+' to ':'set to '}${fmtDate(val)}${by==='email'?' (from email)':''}`);
  p.due=val;touch(p,by);return true;
}
function teamOf(p){const ids=[...new Set([p.leader,...(p.team||[])].filter(Boolean))];return ids.map(userById).filter(Boolean)}
function dueInfo(d){
  if(!d)return{cls:'none',rel:'Not set'};
  const diff=Math.round((new Date(d)-new Date(new Date().toDateString()))/864e5);
  if(diff<0)return{cls:'late',rel:`${-diff} day${diff===-1?'':'s'} overdue`};
  if(diff===0)return{cls:'late',rel:'Today'};
  if(diff<=3)return{cls:'soon',rel:diff===1?'Tomorrow':`In ${diff} days`};
  return{cls:'',rel:`In ${diff} days`};
}
const typeBadge=t=>`<span class="ttype ${t==='private'?'priv':'pub'}">${t==='private'?'Private':'Public'}</span>`;
function cardHTML(p){
  const done=p.subtasks.filter(s=>s.done).length, tot=p.subtasks.length;
  const rem=p.notifications.filter(n=>!n.fired).length;
  const com=p.comments.filter(c=>!c.sys).length, fil=p.files.length+p.uploads.length;
  const du=p.tags.includes('sub')&&p.due?{cls:'done',rel:'Submitted'}:dueInfo(p.due), team=teamOf(p), lead=userById(p.leader);
  const last=(p.dueHistory||[])[0];
  const fresh=p.updatedAt&&Date.now()-p.updatedAt<24*HOUR;
  return `<article class="card ${du.cls==='late'?'is-late':''}" data-id="${p.id}" tabindex="0" aria-label="${esc(p.title)}">
    <div class="c-top">${typeBadge(p.type)}${p.source==='email'?'<span class="src">email</span>':''}
      <span class="c-upd ${fresh?'fresh':''}" title="Last updated ${p.updatedAt?fmtDT(p.updatedAt):''}${p.updatedBy?' by '+esc(p.updatedBy==='email'?'email':p.updatedBy):''}"><i></i>${p.updatedBy==='email'?icon('mail'):''}Updated ${ago(p.updatedAt)}</span></div>
    <h3 dir="auto">${esc(p.title)}</h3>
    ${p.client?`<div class="c-client" dir="auto">${esc(p.client)}</div>`:''}
    <div class="c-due ${du.cls}" title="Submission date">
      ${icon('cal')}<b>${p.due?fmtDate(p.due):'No submission date'}</b>
      ${p.due?`<span class="c-rel">${du.rel}</span>`:''}
      ${last&&Date.now()-last.at<7*24*HOUR?`<span class="c-due-src ${last.by==='email'?'em':''}" title="${last.by==='email'?'Date updated from email':'Date changed by '+esc(last.by)} · ${ago(last.at)}${last.from?' (was '+fmtDate(last.from)+')':''}">${icon(last.by==='email'?'mail':'user')}</span>`:''}
      <button class="c-due-edit" data-nodrag data-due="${p.id}" aria-label="Change submission date" title="Change submission date">${icon('edit')}</button>
      <input type="date" class="due-in" data-duein="${p.id}" value="${p.due||''}" tabindex="-1" aria-hidden="true">
    </div>
    ${p.status?`<div class="c-status" dir="auto">${esc(p.status)}</div>`:''}
    ${p.tags.length?`<div class="card-tags">${p.tags.map(id=>{const t=tagById(id);return t?`<span class="tag"><i class="tdot" style="background:${t.color}"></i>${esc(t.name)}</span>`:''}).join('')}</div>`:''}
    ${tot||p.links.length||com||fil||rem||team.length?`<div class="c-foot">
      ${tot?`<span class="c-tasks" title="${done} of ${tot} sub-tasks done"><span class="c-bar"><i style="width:${done/tot*100}%"></i></span>${done}/${tot}</span>`:''}
      ${p.links.length?`<span title="Links">${icon('link')}${p.links.length}</span>`:''}
      ${com?`<span title="Comments">${icon('msg')}${com}</span>`:''}
      ${fil?`<span title="Files">${icon('file')}${fil}</span>`:''}
      ${rem?`<span class="bell" title="Reminders set">${icon('bell')}${rem}</span>`:''}
      <span class="grow"></span>
      ${team.length?`<span class="c-team" title="Team leader: ${esc(lead?lead.name:'not set')}${team.length>1?' · Team: '+esc(team.map(u=>u.name).join(', ')):''}">${lead?`<span class="lead">${avatar(lead,'sm')}<b>Lead</b></span>`:''}<span class="stack">${team.filter(u=>u!==lead).slice(0,3).map(u=>avatar(u,'sm')).join('')}</span></span>`:''}
    </div>`:''}
  </article>`;
}
function workload(items){
  const t=new Date(new Date().toDateString());const d=x=>(new Date(x.due)-t)/864e5;
  const late=items.filter(x=>x.due&&d(x)<0&&!x.tags.includes('sub')).length, wk=items.filter(x=>x.due&&d(x)>=0&&d(x)<=7).length;
  return (late?`<span class="wl late">· ${late} overdue</span>`:'')+(wk?`<span class="wl">· ${wk} due this week</span>`:'');
}
function colHTML(col,unassigned){
  const items=S.projects.filter(p=>(p.columnId||null)===(col?col.id:null)).sort((a,b)=>a.pos-b.pos);
  const shown=items.filter(matches);
  const u=colUser(col);
  const canEdit=!unassigned&&(isAdmin()||u.id===S.me);
  return `<section class="col ${unassigned?'unassigned':''}" data-col="${col?col.id:''}">

/* ---------------- Drag & drop (mouse + touch, pointer events) ---------------- */
let drag=null;
$('#board').addEventListener('pointerdown',e=>{
  if(e.target.closest('[data-nodrag]'))return;
  const card=e.target.closest('.card'); if(!card||e.button>0)return;
  drag={card,id:card.dataset.id,x:e.clientX,y:e.clientY,started:false,from:card.closest('.col-list').dataset.list};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.started){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;startDrag(e)}
  const g=drag.ghost; g.style.left=(e.clientX-drag.ox)+'px'; g.style.top=(e.clientY-drag.oy)+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const col=el&&el.closest('.col'); $$('.col-list.over').forEach(l=>l.classList.remove('over'));
  if(col){
    const list=$('.col-list',col); list.classList.add('over');
    const emp=$('.empty-col',list); if(emp)emp.style.display='none';
    const cards=$$('.card',list).filter(c=>c!==drag.card);
    const before=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});
    if(before)list.insertBefore(drag.ph,before);else list.appendChild(drag.ph);
  }
  const b=$('#board'),br=b.getBoundingClientRect();
  if(e.clientX>br.right-60)b.scrollLeft+=14; else if(e.clientX<br.left+60)b.scrollLeft-=14;
});
function startDrag(e){
  drag.started=true;
  const r=drag.card.getBoundingClientRect();
  drag.ox=e.clientX-r.left; drag.oy=e.clientY-r.top;
  const g=drag.card.cloneNode(true); g.classList.add('ghost'); g.style.width=r.width+'px'; g.style.left=r.left+'px'; g.style.top=r.top+'px';
  document.body.appendChild(g); drag.ghost=g;
  const ph=document.createElement('div'); ph.className='placeholder'; ph.style.height=r.height+'px'; drag.ph=ph;
  drag.card.replaceWith(ph); document.body.style.cursor='grabbing';
  $('#board').style.scrollBehavior='auto';
}
document.addEventListener('pointerup',()=>{
  if(!drag)return;
  const d=drag; drag=null;
  if(!d.started){openProject(d.id);return}
  document.body.style.cursor=''; $('#board').style.scrollBehavior='';
  const list=d.ph.parentElement; const target=list.dataset.list||null;
  const ids=[...list.children].map(n=>n===d.ph?d.id:n.dataset.id).filter(Boolean);
  const p=proj(d.id); const prev=p.columnId||null;
  p.columnId=target;
  if(prev!==target){touch(p);const u=colUser(colById(target));if(u&&!(p.team||[]).includes(u.id)){p.team=[...(p.team||[]),u.id];if(!p.leader)p.leader=u.id}}
  ids.forEach((id,i)=>{const x=proj(id);if(x)x.pos=i});
  if(prev!==target){
    if(target){p.tags=p.tags.filter(t=>t!=='un'); const n=colName(target);
      log(p,`Assigned to ${n}`); toast(`<b dir="auto">${esc(p.title)}</b> assigned to <b>${esc(n)}</b>`,'user');}
    else{if(!p.tags.includes('un'))p.tags.push('un'); log(p,'Moved back to unassigned'); toast('Moved to <b>Unassigned</b>','user')}
  }
  d.ghost.remove(); save(); renderBoard();
  const nc=$(`.card[data-id="${d.id}"]`); if(nc){nc.style.animation='none';nc.offsetHeight;nc.style.animation='';nc.classList.add('dropped')}
});
document.addEventListener('pointercancel',()=>{if(drag&&drag.started){drag.ghost.remove();drag=null;renderBoard()}else drag=null});

function uploadFiles(p,files){

  if(!p.folder){p.folder=newFolderUrl();log(p,driveName()+' folder created for uploads')}
  [...files].forEach((f,i)=>{

        if(i===files.length-1)toast(`${files.length} file${files.length>1?'s':''} saved to ${esc(driveName())}`,'up')}},160+i*40);
  });
  save();
}

const digits=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const norm=s=>digits(s).replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
const field=(b,labels)=>{for(const l of labels){const m=b.match(new RegExp(l+'\\s*[:：]\\s*(.+)'));if(m)return m[1].trim()}return''};
const findDate=s=>{let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return''};
/* match an email to a project by its name: exact phrase first, then 75% of the name's words */
function findProject(txt){
  const words=s=>norm(s).split(/[\s–\-:،,.()]+/).filter(w=>w.length>2);
  let best=null,score=0;
  S.projects.forEach(p=>{
    const t=norm(p.title);if(t.length>6&&txt.includes(t)){if(score<2){best=p;score=2}return}
    const w=words(p.title);if(!w.length)return;
    const hit=w.filter(x=>txt.includes(x)).length/w.length;
    if(hit>=.75&&hit>score&&score<2){best=p;score=hit}
  });
  return best;
}
function parseMail(m){
  const txt=norm(m.subject+'\n'+m.body);
  const urls=(m.body.match(/https?:\/\/[^\s)،]+/g)||[]);
  let kind='ignore';
  if(/تاجيل|مؤجل|موجل/.test(txt))kind='postpone';
  else if(/استفسار/.test(txt))kind='queries';
  else if(/ورد\s*الينا/.test(txt))kind='new';
  const typeTxt=norm(field(digits(m.body),['نوع المناقصة','نوع الطرح'])||m.subject);
  const type=/محدود|خاص|ممارس/.test(typeTxt)?'private':/عام/.test(typeTxt)?'public':'';
  const dueField=field(digits(m.body),['[اأإآ]خر موعد للتقديم','موعد التقديم']);
  return {kind,urls,txt,type,
    title:field(digits(m.body),['اسم المشروع']),client:field(digits(m.body),['الجهة المالكة','الجهة']),
    due:findDate(dueField||digits(m.subject+'\n'+m.body))};
}
function applyMail(m){
  const r=parseMail(m); const existing=findProject(r.txt);
  const addLinks=p=>r.urls.forEach(u=>{if(!p.links.some(l=>l.url===u))p.links.push({id:uid(),title:(u.split('/').pop()||'Link'),url:u,src:true})});
  const short=p=>p.title.length>38?p.title.slice(0,36)+'…':p.title;
  const dateNote=p=>{const ch=r.due&&setDue(p,r.due,'email');return ch?' · submission date now '+fmtDate(p.due):''};
  let res={kind:r.kind,label:'Ignored – not a tender email',pid:null};
  if(r.kind==='new'){
    if(existing){if(!existing.tags.includes('upd'))existing.tags.push('upd');existing.status='New update received by email';addLinks(existing);
      const dn=dateNote(existing);touch(existing,'email');log(existing,'Email: '+m.subject);res={kind:'upd',label:`New update → ${short(existing)}${dn}`,pid:existing.id}}
    else{const p=mkProject({title:r.title||m.subject.replace(/ورد\s*[اإ]لينا\s*[–-]?\s*/,''),client:r.client,type:r.type||'public',due:r.due,tags:['new','un'],status:'Received by email – needs an engineer',source:'email',updatedBy:'email'});
      addLinks(p);log(p,'Created from email: '+m.subject);res={kind:'new',label:`New ${p.type} tender created${p.due?' · submission '+fmtDate(p.due):''}`,pid:p.id}}
  }
  if(r.kind==='postpone'){
    if(existing){if(!existing.tags.includes('pp'))existing.tags.push('pp');
      const nd=findDate(digits(m.body));if(nd)setDue(existing,nd,'email');
      existing.status='Postponed'+(nd?' to '+fmtDate(nd):'');addLinks(existing);touch(existing,'email');log(existing,'Email: '+m.subject);
      res={kind:'pp',label:`Postponed → ${short(existing)}${nd?' · new submission date '+fmtDate(nd):''}`,pid:existing.id}}
    else res={kind:'ignore',label:'Postponement for a project not on the board – review manually',pid:null};
  }
  if(r.kind==='queries'){
    if(existing){if(!existing.tags.includes('qa'))existing.tags.push('qa');existing.status='Answers to queries received – review';addLinks(existing);
      const dn=dateNote(existing);touch(existing,'email');log(existing,'Email: '+m.subject);
      res={kind:'qa',label:`Queries answers → ${short(existing)} · ${r.urls.length} link${r.urls.length!==1?'s':''} added${dn}`,pid:existing.id}}
    else res={kind:'ignore',label:'Queries answers for a project not on the board – review manually',pid:null};
  }
  S.mail.processed.push(m.id); S.mail.log.unshift({id:m.id,...res,at:Date.now()});
  return res;
}
let syncing=false;
async function syncMail(auto=false){
  if(syncing)return; if(!S.mail.connected)return toast('Connect the mailbox first','x');
  syncing=true; $('#syncBtn').classList.add('spin'); const sc=$('#scanBar'); sc&&sc.classList.add('on');
  await new Promise(r=>setTimeout(r,1400));
  const pending=MAILBOX.filter(m=>!S.mail.processed.includes(m.id));
  const results=pending.map(applyMail);
  S.mail.lastSync=Date.now(); save(); syncing=false; $('#syncBtn').classList.remove('spin');
  renderBoard(); if(cur)renderPage(); if($('#mailSheet').classList.contains('show'))renderMailSheet();
  results.forEach(r=>r.pid&&flash(r.pid));
  const made=results.filter(r=>r.kind==='new').length, upd=results.filter(r=>r.pid&&r.kind!=='new').length;
  toast(pending.length?`Email ${auto?'auto-':''}sync: <b>${pending.length}</b> read · ${made} new · ${upd} updated`:'Inbox up to date – no new emails','mail',4200);
  if(made&&'Notification' in window&&Notification.permission==='granted')new Notification('Rendcon – new tender'+(made>1?'s':''),{body:`${made} new project${made>1?'s':''} added to Unassigned`});
}

const PROV={
  google:{name:'Google Drive',short:'Drive',icon:'gdrive',vb:'0 0 87.3 78',hint:'https://drive.google.com/drive/folders/…',url:id=>`https://drive.google.com/drive/folders/${id}`},
  onedrive:{name:'OneDrive',short:'OneDrive',icon:'onedrive',vb:'0 0 32 20',hint:'https://onedrive.live.com/… or https://company.sharepoint.com/…',url:id=>`https://onedrive.live.com/?id=${id}`}

function folderProv(url){
  if(/drive\.google\.com|docs\.google\.com/i.test(url))return'google';

function newFolderUrl(){return prov().url(uid()+uid())}

  modal(`<h3>Cloud storage</h3>

    <div class="acts">${d.connected?'<button class="btn" id="dOff" style="margin-right:auto">Disconnect</button>':''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="dOk">${d.connected?'Save':'Connect'}</button></div>`,()=>{
    $('#modal .box').classList.add('wide');
    $('#dProv').onclick=e=>{const b=e.target.closest('[data-prov]');if(!b)return;pick=b.dataset.prov;$$('#dProv .prov').forEach(x=>x.classList.toggle('on',x===b));$('#dRoot').placeholder=PROV[pick].hint};

    $('#dOk').onclick=()=>{
      const root=$('#dRoot').value.trim();

  });

const APP_URL='https://planning.rendcon.example';
function sendEmail(to,subject,body,kind){S.outbox.unshift({id:uid(),to,subject,body,kind,at:Date.now()});S.outbox=S.outbox.slice(0,60)}
function inviteFormHTML(pre){
  return `<div class="formgrid">

    <label class="chk-row" style="align-self:end"><input type="checkbox" id="${pre}Col" checked>Give them a board column</label>
  </div>
  <datalist id="discList"><option>Civil & structure</option><option>MEP</option><option>Infrastructure</option><option>Architecture</option><option>Quantity surveying</option></datalist>`;

function sendInvite(pre){
  const email=$('#'+pre+'Email').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Enter a valid email address','x');$('#'+pre+'Email').focus();return false}
  if(S.users.some(u=>u.email.toLowerCase()===email)){toast('That email is already on the team','x');return false}
  const name=$('#'+pre+'Name').value.trim()||email.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const u={id:uid(),name,email,role:$('#'+pre+'Role').value,discipline:$('#'+pre+'Disc').value.trim(),color:COLORS[S.users.length%COLORS.length],status:'invited',invitedAt:Date.now(),token:uid()+uid(),prefs:{browser:true,email:true,digest:false}};
  S.users.push(u);
  if($('#'+pre+'Col').checked)S.columns.push({id:uid(),userId:u.id});
  inviteEmail(u);save();renderBoard();
  toast(`Invitation sent to <b>${esc(email)}</b>`,'send');
  return true;
}
function inviteLink(u){if(!u.token)u.token=uid()+uid();return `${APP_URL}/invite/${u.token}`}
function inviteEmail(u){
  sendEmail(u.email,'You are invited to Rendcon Tender Planning',
    `Hello ${u.name},\n\n${me().name} invited you to join Rendcon Tender Planning as ${u.role==='admin'?'an admin':'an engineer'}.\nAccept the invitation and set up your profile:\n${inviteLink(u)}\n\nThis link expires in 7 days.`,'invite');
  u.invitedAt=Date.now();
}
function removeMember(id){
  const u=userById(id);if(!u||id===S.adminId)return;
  if(!confirm(`Remove ${u.name} from the team? Their projects move to Unassigned.`))return;
  const c=colOfUser(id);
  if(c){S.projects.filter(p=>p.columnId===c.id).forEach(p=>{p.columnId=null;if(!p.tags.includes('un'))p.tags.push('un')});S.columns=S.columns.filter(x=>x!==c)}
  S.users=S.users.filter(x=>x.id!==id);save();renderBoard();renderTeamSheet();toast(`${esc(u.name)} removed`);
}
function memberStats(u){
  const c=colOfUser(u.id);const ps=c?S.projects.filter(p=>p.columnId===c.id):[];
  const today=new Date(new Date().toDateString());
  return{active:ps.length,week:ps.filter(p=>p.due&&(new Date(p.due)-today)/864e5>=0&&(new Date(p.due)-today)/864e5<=7).length,late:ps.filter(p=>p.due&&new Date(p.due)<today).length};
}

        ${u.id!==S.adminId?`<button class="btn ghost icon sm" data-rm="${u.id}" aria-label="Remove" title="Remove from team">${icon('trash')}</button>`:''}

    <div class="section-label">Emails sent</div>
    ${S.outbox.length?S.outbox.slice(0,12).map(m=>`<div class="sent"><span style="color:var(--accent)">${icon(m.kind==='invite'?'send':'bell')}</span><div class="b"><b style="font-weight:500">${esc(m.subject)}</b><small>to ${esc(Array.isArray(m.to)?m.to.join(', '):m.to)} · ${fmtDT(m.at)}</small></div></div>`).join(''):'<div class="empty">No emails sent yet.</div>'}

    if(d.edit)editProfile(d.edit);
    if(d.rm)removeMember(d.rm);
  };
}
function editProfile(id){
  const u=userById(id);if(!u)return;
  const canEdit=isAdmin()||id===S.me; if(!canEdit)return;
  const st=memberStats(u), self=id===S.me;
  let color=u.color;
  modal(`<div class="prof-head"><span id="pfAv">${avatar(u,'lg')}</span><div><h3 dir="auto">${esc(u.name)}</h3><small>${esc(u.email)} · ${u.role==='admin'?'Admin':'Engineer'}${u.status==='invited'?' · invitation pending':''}</small></div></div>
    <div class="stats"><div><b>${st.active}</b><small>Projects</small></div><div><b>${st.week}</b><small>Due this week</small></div><div><b style="${st.late?'color:var(--danger)':''}">${st.late}</b><small>Overdue</small></div></div>
    <div class="formgrid">
      <div class="full"><label class="lbl-sm" for="pfName">Full name</label><input class="in" id="pfName" value="${esc(u.name)}" dir="auto"></div>
      <div><label class="lbl-sm" for="pfEmail">Email</label><input class="in" id="pfEmail" type="email" value="${esc(u.email)}" ${isAdmin()?'':'disabled'}></div>
      <div><label class="lbl-sm" for="pfDisc">Discipline</label><input class="in" id="pfDisc" value="${esc(u.discipline||'')}" list="discList2"></div>
      ${isAdmin()&&!self?`<div><label class="lbl-sm" for="pfRole">Access</label><select class="in" id="pfRole"><option value="engineer" ${u.role==='engineer'?'selected':''}>Engineer</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div>`:''}
      <div class="full"><span class="lbl-sm">Avatar colour</span><div class="swatches" id="pfSw">${COLORS.map(c=>`<button type="button" data-c="${c}" class="${c===u.color?'on':''}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}</div></div>
    </div>
    <datalist id="discList2"><option>Civil & structure</option><option>MEP</option><option>Infrastructure</option><option>Architecture</option></datalist>
    <span class="lbl-sm">Notifications</span>
    <label class="chk-row"><input type="checkbox" id="pfBr" ${u.prefs.browser?'checked':''}>Desktop / browser notifications</label>
    <label class="chk-row"><input type="checkbox" id="pfEm" ${u.prefs.email?'checked':''}>Reminders by email</label>
    <label class="chk-row"><input type="checkbox" id="pfDg" ${u.prefs.digest?'checked':''}>Daily summary email at 08:00</label>
    <div class="acts" style="margin-top:14px">${u.status==='invited'&&isAdmin()?`<button class="btn" id="pfResend" style="margin-right:auto">${icon('send')}Resend invite</button>`:''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="pfSave">Save profile</button></div>`,()=>{
    $('#modal .box').classList.add('wide');
    $('#pfSw').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;color=b.dataset.c;$$('#pfSw button').forEach(x=>x.classList.toggle('on',x===b));$('#pfAv .avatar').style.background=color};
    const rs=$('#pfResend');if(rs)rs.onclick=()=>{inviteEmail(u);save();toast(`Invitation sent again to <b>${esc(u.email)}</b>`,'send')};
    $('#pfSave').onclick=()=>{
      const n=$('#pfName').value.trim();if(!n)return $('#pfName').focus();
      const em=$('#pfEmail').value.trim();
      if(isAdmin()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return toast('Enter a valid email address','x');
      const old=u.name;u.name=n;if(isAdmin())u.email=em;u.discipline=$('#pfDisc').value.trim();u.color=color;
      if($('#pfRole'))u.role=$('#pfRole').value;
      u.prefs={browser:$('#pfBr').checked,email:$('#pfEm').checked,digest:$('#pfDg').checked};
      S.projects.forEach(p=>p.comments.forEach(c=>{if(c.who===old)c.who=n}));
      save();closeModal();renderBoard();renderTeamSheet();if(cur)renderPage();toast('Profile saved');
    };
  });
}
function switchUser(id){S.me=id;save();if(cur)closePage();sheet(null);renderBoard();toast(id===S.adminId?'Back to your admin view':`Previewing as <b>${esc(me().name)}</b>`,'user')}
$('#meBtn').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const items=[['My profile','user',()=>editProfile(S.me)]];
  if(S.me===S.adminId){items.push(['Team & invitations','users',()=>sheet('teamSheet')]);
    S.users.filter(u=>u.id!==S.adminId).forEach(u=>items.push(['Preview as '+u.name,'ext',()=>switchUser(u.id)]))}
  else items.push(['Back to admin view','left',()=>switchUser(S.adminId)]);
  menu(r.right-240,r.bottom+8,items);
  $('#menu').style.minWidth='240px';
};
$('#teamBtn').onclick=()=>sheet('teamSheet');

/* ---------------- Reminders: who gets them ---------------- */
function recipPicker(id,selected,withAssignee){
  const opt=(v,html,cls='')=>`<button type="button" class="${cls} ${selected.includes(v)?'on':''}" data-r="${v}">${html}</button>`;
  return `<div class="recips" id="${id}">${opt('all','Everyone','txt')}${withAssignee?opt('assignee','Assigned engineer','txt'):''}${S.users.map(u=>opt(u.id,avatar(u,'sm')+esc(u.name.replace(/^Eng\.\s*/,'')))).join('')}</div>`;
}
function bindPicker(id){
  const el=$('#'+id);
  el.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;
    if(b.dataset.r==='all'){$$('[data-r]',el).forEach(x=>x.classList.toggle('on',x===b&&!b.classList.contains('on')))}
    else{b.classList.toggle('on');$('[data-r="all"]',el).classList.remove('on')}};
  return()=>$$('[data-r].on',el).map(b=>b.dataset.r);
}
function resolveTo(n,p){
  const ids=new Set();
  (n.to&&n.to.length?n.to:['me']).forEach(t=>{
    if(t==='all')S.users.forEach(u=>ids.add(u.id));
    else if(t==='assignee'){const u=p&&colUser(colById(p.columnId));if(u)ids.add(u.id)}
    else if(t==='me')ids.add(S.adminId);
    else if(userById(t))ids.add(t);
  });
  return[...ids].map(userById);
}
function toLabel(n,p){
  if(!n.to||!n.to.length)return'Just me';
  if(n.to.includes('all'))return'Everyone';
  return n.to.map(t=>t==='assignee'?(p&&colUser(colById(p.columnId))?colName(p.columnId):'Assigned engineer'):t==='me'?userById(S.adminId).name:(userById(t)||{}).name).filter(Boolean).join(', ');
}
function deliver(n,p){
  const users=resolveTo(n,p);
  const title='Reminder'+(p?' · '+(p.title.length>40?p.title.slice(0,38)+'…':p.title):'');
  const body=n.msg;
  const viewer=users.find(u=>u.id===S.me);
  if(viewer&&viewer.prefs.browser)notify(title,body);
  const mailTo=n.email?users.filter(u=>u.prefs.email).map(u=>u.email):[];
  if(mailTo.length)sendEmail(mailTo,title+': '+n.msg,body+(p?`\n\nOpen the project: ${APP_URL}/#p/${p.id}`:''),'reminder');
  S.sentLog.unshift({id:uid(),msg:n.msg,project:p?p.title:'',names:users.map(u=>u.name),email:mailTo.length,at:Date.now()});S.sentLog=S.sentLog.slice(0,40);
  if(!viewer)toast(`Reminder sent to <b>${esc(users.map(u=>u.name).join(', ')||'nobody')}</b>${mailTo.length?' · email':''}`,'bell',5000);
}

/* ---------------- Reminder engine ---------------- */
function notify(title,body){
  toast(`<b>${esc(title)}</b><br><span dir="auto">${esc(body)}</span>`,'bell',7000);
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification(title,{body,tag:title+body});n.onclick=()=>window.focus()}}catch(e){}
}
function fire(n,p,now){
  deliver(n,p);
  const step={hourly:HOUR,daily:24*HOUR,weekly:168*HOUR}[n.repeat];
  if(step){while(n.at<=now)n.at+=step}else n.fired=true;
}
function tick(){
  const now=Date.now(); let changed=false;
  S.projects.forEach(p=>p.notifications.forEach(n=>{if(!n.fired&&n.at<=now){fire(n,p,now);changed=true}}));
  S.reminders.forEach(n=>{if(!n.fired&&n.at<=now){fire(n,null,now);changed=true}});
  if(S.mail.connected&&S.mail.hourly&&now-S.mail.lastSync>=HOUR)syncMail(true);
  if(changed){save();renderBoard();if(cur&&curTab==='notifications')renderPane();if($('#remSheet').classList.contains('show'))renderRemSheet()}
  updateSyncMeta();
}
setInterval(tick,15000);

renderBoard(); route(); tick();
</script>
