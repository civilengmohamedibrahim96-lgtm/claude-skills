# Deploys the Redcon Tender Planning Supabase edge functions.
# Run it by hand: GitHub → Actions → "Deploy Supabase functions" → Run workflow.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
name: Deploy Supabase functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Which function to deploy
        required: true
        default: mail-sync
        type: choice
        options: [mail-sync, send-reminders, mail-review, all]
      branch:
        description: Branch whose code is deployed (the live app branch by default)
        required: true
        default: claude/project-thread-s19gtk
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uwzocjlpjpbmfphblgsg
    defaults:
      run:
        working-directory: rendcon-tender-planning/supabase
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Deploy
        env:
          FN: ${{ inputs.function }}
        run: |
          deploy() {
            case "$1" in
              mail-review) supabase functions deploy "$1" --project-ref "$PROJECT_REF" ;;
              *) supabase functions deploy "$1" --no-verify-jwt --project-ref "$PROJECT_REF" ;;
            esac
          }
          if [ "$FN" = all ]; then
            for f in mail-sync send-reminders mail-review; do deploy "$f"; done
          else
            deploy "$FN"
          fi
